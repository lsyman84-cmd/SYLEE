<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🐻 Living Bear</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#fdf6ee;
  --text:#3d2b1f;
  --shadow:rgba(61,43,31,.18);
}

body{
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'Segoe UI',system-ui,sans-serif;
  color:var(--text);
  user-select:none;
  overflow:hidden;
}

/* ── title ── */
h1{
  font-size:1.35rem;
  font-weight:700;
  letter-spacing:.06em;
  margin-bottom:1.6rem;
  opacity:.65;
}

/* ── stage ── */
#stage{
  position:relative;
  width:300px;
  height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* ── shadow under bear ── */
#bear-shadow{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  width:140px;
  height:22px;
  background:radial-gradient(ellipse,rgba(61,43,31,.22) 0%,transparent 70%);
  pointer-events:none;
  transition:width .2s,opacity .2s;
}

/* ── bear wrap (physics target) ── */
#bear-wrap{
  position:absolute;
  width:200px;
  height:220px;
  will-change:transform;
}

#bear-svg{
  width:100%;height:100%;
  overflow:visible;
}

/* ── particle canvas ── */
#particle-canvas{
  position:absolute;
  top:-50px;left:-50px;
  width:400px;height:400px;
  pointer-events:none;
}

/* ── speech bubble ── */
#speech{
  position:absolute;
  top:8px;right:-8px;
  background:#fff;
  border-radius:16px 16px 16px 4px;
  padding:.45em 1em;
  font-size:.78rem;
  font-weight:700;
  box-shadow:0 4px 18px var(--shadow);
  white-space:nowrap;
  opacity:0;
  transform:scale(.55) translateY(10px);
  transform-origin:bottom left;
  transition:opacity .22s,transform .22s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;
  z-index:20;
}
#speech.show{opacity:1;transform:scale(1) translateY(0)}

/* ── status badge ── */
#status-badge{
  margin-top:1.4rem;
  padding:.4em 1.3em;
  border-radius:999px;
  font-size:.85rem;
  font-weight:800;
  letter-spacing:.07em;
  box-shadow:0 4px 14px var(--shadow);
  transition:background .5s,color .5s;
}

/* ── buttons ── */
#controls{
  display:flex;
  gap:.7rem;
  margin-top:1.3rem;
  flex-wrap:wrap;
  justify-content:center;
}
.ctrl-btn{
  padding:.5em 1.25em;
  border:none;
  border-radius:999px;
  font-size:.84rem;
  font-weight:700;
  cursor:pointer;
  letter-spacing:.04em;
  box-shadow:0 3px 10px var(--shadow);
  transition:transform .14s cubic-bezier(.34,1.56,.64,1),
             box-shadow .14s, filter .14s;
}
.ctrl-btn:hover{filter:brightness(1.06)}
.ctrl-btn:active{transform:scale(.9)!important}
.ctrl-btn.active{transform:scale(1.08);box-shadow:0 6px 20px var(--shadow)}

.ctrl-btn[data-state=idle]  {background:#a8dadc;color:#1d5c63}
.ctrl-btn[data-state=happy] {background:#f4c95d;color:#7a4e00}
.ctrl-btn[data-state=hungry]{background:#f4a261;color:#7a2700}
.ctrl-btn[data-state=sleepy]{background:#c9b8e8;color:#3b2a6e}

/* ── hint ── */
#hint{
  margin-top:1rem;
  font-size:.72rem;
  opacity:.38;
  letter-spacing:.04em;
}
</style>
</head>
<body>
<h1>🐻 Living Bear</h1>

<div id="stage">
  <div id="bear-shadow"></div>
  <canvas id="particle-canvas" width="400" height="400"></canvas>

  <div id="bear-wrap">
    <svg id="bear-svg" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gBody" cx="42%" cy="32%" r="65%">
          <stop offset="0%" stop-color="#d4956a"/>
          <stop offset="100%" stop-color="#a0613a"/>
        </radialGradient>
        <radialGradient id="gBelly" cx="50%" cy="38%" r="62%">
          <stop offset="0%" stop-color="#f7d9be"/>
          <stop offset="100%" stop-color="#e8b98a"/>
        </radialGradient>
        <radialGradient id="gEye" cx="30%" cy="28%" r="65%">
          <stop offset="0%" stop-color="#fff" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- EARS (individual groups for spring bounce) -->
      <g id="ear-L">
        <ellipse cx="52" cy="52" rx="26" ry="26" fill="url(#gBody)"/>
        <ellipse cx="52" cy="52" rx="16" ry="16" fill="#f0b48a"/>
      </g>
      <g id="ear-R">
        <ellipse cx="148" cy="52" rx="26" ry="26" fill="url(#gBody)"/>
        <ellipse cx="148" cy="52" rx="16" ry="16" fill="#f0b48a"/>
      </g>

      <!-- BODY -->
      <g id="body-g">
        <ellipse id="body-ell" cx="100" cy="165" rx="62" ry="58" fill="url(#gBody)"/>
        <ellipse id="belly-ell" cx="100" cy="170" rx="40" ry="38" fill="url(#gBelly)"/>
        <!-- paws -->
        <g id="paw-L">
          <ellipse cx="50" cy="200" rx="20" ry="12" fill="#a0613a"/>
          <ellipse cx="50" cy="200" rx="13" ry="8"  fill="#c4825a"/>
        </g>
        <g id="paw-R">
          <ellipse cx="150" cy="200" rx="20" ry="12" fill="#a0613a"/>
          <ellipse cx="150" cy="200" rx="13" ry="8"  fill="#c4825a"/>
        </g>
      </g>

      <!-- HEAD GROUP (root for head-spring transform) -->
      <g id="head-g">
        <!-- head -->
        <ellipse id="head-ell" cx="100" cy="105" rx="68" ry="65" fill="url(#gBody)"/>

        <!-- cheeks -->
        <ellipse id="ck-L" cx="60"  cy="120" rx="16" ry="10" fill="#f4a0a0" opacity=".55"/>
        <ellipse id="ck-R" cx="140" cy="120" rx="16" ry="10" fill="#f4a0a0" opacity=".55"/>

        <!-- muzzle -->
        <ellipse cx="100" cy="126" rx="30" ry="22" fill="#f7d9be"/>

        <!-- LEFT EYE — drawn entirely in JS via canvas-like direct SVG attr changes -->
        <g id="eye-L-g">
          <!-- pupil ellipse (ry will shrink to 0 on blink) -->
          <ellipse id="pupil-L" cx="78" cy="102" rx="11" ry="12" fill="#2d1a0e"/>
          <!-- iris -->
          <ellipse id="iris-L" cx="78" cy="102" rx="7" ry="8" fill="#4a2f1e"/>
          <!-- highlight -->
          <circle id="hi-L" cx="82" cy="97" r="4" fill="url(#gEye)"/>
          <!-- lower gleam -->
          <circle cx="74" cy="107" r="2" fill="#fff" opacity=".3"/>
          <!-- happy arc (hidden when ry=0) -->
          <path id="arc-L" d="M68,108 Q78,96 88,108" fill="none"
                stroke="#2d1a0e" stroke-width="3.5" stroke-linecap="round" opacity="0"/>
        </g>
        <!-- RIGHT EYE -->
        <g id="eye-R-g">
          <ellipse id="pupil-R" cx="122" cy="102" rx="11" ry="12" fill="#2d1a0e"/>
          <ellipse id="iris-R" cx="122" cy="102" rx="7" ry="8" fill="#4a2f1e"/>
          <circle id="hi-R" cx="126" cy="97" r="4" fill="url(#gEye)"/>
          <circle cx="118" cy="107" r="2" fill="#fff" opacity=".3"/>
          <path id="arc-R" d="M112,108 Q122,96 132,108" fill="none"
                stroke="#2d1a0e" stroke-width="3.5" stroke-linecap="round" opacity="0"/>
        </g>

        <!-- NOSE -->
        <ellipse cx="100" cy="120" rx="8" ry="6" fill="#2d1a0e"/>
        <ellipse cx="98"  cy="118" rx="3" ry="2" fill="#fff" opacity=".4"/>

        <!-- MOUTH — single path, d attribute lerped in JS -->
        <path id="mouth-path" d="M92,132 Q100,140 108,132"
              fill="none" stroke="#2d1a0e" stroke-width="2.8" stroke-linecap="round"/>
        <!-- hungry open mouth (separate, animated opacity) -->
        <g id="mouth-open" opacity="0">
          <ellipse cx="100" cy="137" rx="18" ry="14" fill="#2d1a0e"/>
          <ellipse cx="100" cy="133" rx="16" ry="8"  fill="#c1504b"/>
          <ellipse cx="100" cy="144" rx="12" ry="5"  fill="#7a1f1a"/>
          <ellipse cx="100" cy="144" rx="10" ry="5"  fill="#e05555"/>
        </g>

        <!-- ZZZ -->
        <g id="zzz-g" opacity="0">
          <text id="z1" x="152" y="74"  font-size="13" font-weight="900" fill="#c9b8e8">z</text>
          <text id="z2" x="165" y="56"  font-size="17" font-weight="900" fill="#c9b8e8">z</text>
          <text id="z3" x="181" y="35"  font-size="22" font-weight="900" fill="#c9b8e8">z</text>
        </g>

        <!-- SPARKLES -->
        <g id="spark-g" opacity="0">
          <text x="28"  y="52"  font-size="15">✨</text>
          <text x="158" y="46"  font-size="13">⭐</text>
          <text x="20"  y="92"  font-size="11">✨</text>
        </g>
      </g>
    </svg>
  </div>

  <div id="speech"></div>
</div>

<div id="status-badge">😊 IDLE</div>

<div id="controls">
  <button class="ctrl-btn active" data-state="idle">😊 Idle</button>
  <button class="ctrl-btn" data-state="happy">🌟 Happy</button>
  <button class="ctrl-btn" data-state="hungry">🍖 Hungry</button>
  <button class="ctrl-btn" data-state="sleepy">😴 Sleepy</button>
</div>
<div id="hint">click the bear · move your mouse</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   SPRING PHYSICS
   Simple damped spring: stiffness k, damping d
   value() returns current position, done() returns true when settled
════════════════════════════════════════════════════════════════════ */
class Spring {
  constructor(stiffness = 180, damping = 22, mass = 1) {
    this.k = stiffness;
    this.d = damping;
    this.m = mass;
    this.pos = 0;
    this.vel = 0;
    this.target = 0;
  }
  setTarget(t) { this.target = t; }
  impulse(v)   { this.vel += v; }
  tick(dt) {
    const dt2 = Math.min(dt, 0.05);
    const acc = (-this.k * (this.pos - this.target) - this.d * this.vel) / this.m;
    this.vel += acc * dt2;
    this.pos += this.vel * dt2;
  }
  done() { return Math.abs(this.pos - this.target) < 0.001 && Math.abs(this.vel) < 0.001; }
}

/* ════════════════════════════════════════════════════════════════════
   LERP / CLAMP helpers
════════════════════════════════════════════════════════════════════ */
const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* ════════════════════════════════════════════════════════════════════
   BEAR CONTROLLER
════════════════════════════════════════════════════════════════════ */
class BearController {

  /* ── STATE CONFIG ───────────────────────────────────────────── */
  static CFG = {
    idle: {
      label:'😊 IDLE', bg:'#a8dadc', color:'#1d5c63',
      speech:['...','hi~','(^▽^)','♪','(°ᴗ°)'],
      breathAmp:0.022, breathHz:0.34,
      headBobAmp:2.5, headBobHz:0.26,
      blush:0.55,
      eyeOpenTarget:1,    // 1 = fully open
      happyArcAlpha:0,
      hungerAlpha:0,
      zzzAlpha:0,
      sparkAlpha:0,
      blinkMin:2200, blinkMax:5800,
      bodySpring:{k:160,d:20},
      mouthCurve:8,       // Q control point Y offset from baseline
    },
    happy: {
      label:'🌟 HAPPY', bg:'#f4c95d', color:'#7a4e00',
      speech:['YAY!','woohoo~','★★★','(*´∀`)♪','wheee!'],
      breathAmp:0.038, breathHz:0.55,
      headBobAmp:6, headBobHz:0.55,
      blush:0.80,
      eyeOpenTarget:1,
      happyArcAlpha:1,
      hungerAlpha:0,
      zzzAlpha:0,
      sparkAlpha:1,
      blinkMin:1800, blinkMax:4000,
      bodySpring:{k:220,d:16},
      mouthCurve:14,
    },
    hungry: {
      label:'🍖 HUNGRY', bg:'#f4a261', color:'#7a2700',
      speech:['nomnom...','feed me!','hungry...','( ˘ ³˘)♥','!!'],
      breathAmp:0.015, breathHz:0.28,
      headBobAmp:3, headBobHz:0.32,
      blush:0.35,
      eyeOpenTarget:0.85,
      happyArcAlpha:0,
      hungerAlpha:1,
      zzzAlpha:0,
      sparkAlpha:0,
      blinkMin:3000, blinkMax:7000,
      bodySpring:{k:170,d:22},
      mouthCurve:8,
    },
    sleepy: {
      label:'😴 SLEEPY', bg:'#c9b8e8', color:'#3b2a6e',
      speech:['zzz...','sleepy...','💤','*yawn*','(-.-)zzz'],
      breathAmp:0.010, breathHz:0.18,
      headBobAmp:9, headBobHz:0.16,
      blush:0.42,
      eyeOpenTarget:0.28,
      happyArcAlpha:0,
      hungerAlpha:0,
      zzzAlpha:1,
      sparkAlpha:0,
      blinkMin:600, blinkMax:1600,
      bodySpring:{k:100,d:18},
      mouthCurve:3,
    },
  };

  /* ── CONSTRUCTOR ────────────────────────────────────────────── */
  constructor() {

    // ── DOM refs
    this.stage      = document.getElementById('stage');
    this.bearWrap   = document.getElementById('bear-wrap');
    this.shadow     = document.getElementById('bear-shadow');
    this.badge      = document.getElementById('status-badge');
    this.speechEl   = document.getElementById('speech');
    this.canvas     = document.getElementById('particle-canvas');
    this.ctx        = this.canvas.getContext('2d');

    // SVG elements
    this.headG      = document.getElementById('head-g');
    this.bodyG      = document.getElementById('body-g');
    this.earL       = document.getElementById('ear-L');
    this.earR       = document.getElementById('ear-R');
    this.pawL       = document.getElementById('paw-L');
    this.pawR       = document.getElementById('paw-R');

    this.pupilL     = document.getElementById('pupil-L');
    this.pupilR     = document.getElementById('pupil-R');
    this.irisL      = document.getElementById('iris-L');
    this.irisR      = document.getElementById('iris-R');
    this.hiL        = document.getElementById('hi-L');
    this.hiR        = document.getElementById('hi-R');
    this.arcL       = document.getElementById('arc-L');
    this.arcR       = document.getElementById('arc-R');

    this.mouthPath  = document.getElementById('mouth-path');
    this.mouthOpen  = document.getElementById('mouth-open');
    this.ckL        = document.getElementById('ck-L');
    this.ckR        = document.getElementById('ck-R');

    this.zzzG       = document.getElementById('zzz-g');
    this.sparkG     = document.getElementById('spark-g');
    this.z1         = document.getElementById('z1');
    this.z2         = document.getElementById('z2');
    this.z3         = document.getElementById('z3');

    // ── State
    this.state      = 'idle';
    this.prevState  = 'idle';

    // ── Springs (body physics)
    this.sScaleX    = new Spring(160, 20);   // squash X
    this.sScaleY    = new Spring(160, 20);   // squash Y
    this.sTransX    = new Spring(140, 18);   // push left/right
    this.sTransY    = new Spring(140, 18);   // push up/down
    this.sRotate    = new Spring(120, 16);   // tilt

    // head spring
    this.sHeadX     = new Spring(130, 17);
    this.sHeadY     = new Spring(130, 17);
    this.sHeadRot   = new Spring(100, 14);

    // ear springs
    this.sEarL      = new Spring(300, 18);
    this.sEarR      = new Spring(300, 18);

    // eye openness (0=closed, 1=open) with slow lerp
    this.eyeOpen    = 1;
    this.eyeOpenTgt = 1;

    // blink state
    this.blinking   = false;
    this.blinkT     = 0;    // 0=open, 1=closed, smooth

    // mouse tracking (SVG space, smoothed)
    this.mouseX     = 0;
    this.mouseY     = 0;
    this.eyeOffX    = 0;   // smoothed
    this.eyeOffY    = 0;
    this.mouseNearFactor = 0;

    // Breathing
    this.breathT    = Math.random() * Math.PI * 2;
    this.breathAmp  = BearController.CFG.idle.breathAmp;
    this.breathHz   = BearController.CFG.idle.breathHz;
    this.breathNoise = 0;   // random jitter on period
    this.breathNoiseTarget = 0;

    // Head bob
    this.headBobT   = Math.random() * Math.PI * 2;

    // Smooth emotion alphas (lerped each frame)
    this.emo = {
      blush: 0.55,
      happyArc: 0,
      hunger: 0,
      zzz: 0,
      spark: 0,
      mouthCurve: 8,
    };

    // Zzz float
    this.zzzT = 0;

    // Sparkle float
    this.sparkT = 0;

    // Particles
    this.particles  = [];

    // Timers
    this.blinkTimer = null;
    this.speechTimer = null;
    this.autoStateTimer = null;
    this.randomActTimer = null;

    // Frame timing
    this.lastTs     = null;

    // ── Boot
    this._bindEvents();
    this._schedBlink();
    this._schedAutoState();
    this._schedRandomAct();
    this._applyStateCfg('idle', true);
    requestAnimationFrame(ts => this._loop(ts));
  }

  /* ══════════════════════════════════════════════════════════════
     MAIN RAF LOOP
  ══════════════════════════════════════════════════════════════ */
  _loop(ts) {
    const dt = this.lastTs ? (ts - this.lastTs) / 1000 : 0.016;
    this.lastTs = ts;

    this._tickPhysics(dt);
    this._tickEmotion(dt);
    this._tickParticles();
    this._applyTransforms();

    requestAnimationFrame(t => this._loop(t));
  }

  /* ── Physics tick ─────────────────────────────────────────── */
  _tickPhysics(dt) {
    const cfg = BearController.CFG[this.state];

    // Breathing: slightly random period using noise
    this.breathNoise = lerp(this.breathNoise, this.breathNoiseTarget, dt * 0.4);
    this.breathHz    = lerp(this.breathHz, cfg.breathHz + this.breathNoise, dt * 1.5);
    this.breathAmp   = lerp(this.breathAmp, cfg.breathAmp, dt * 1.5);
    this.breathT    += dt * this.breathHz * Math.PI * 2;

    // Head bob
    const hbHz = cfg.headBobHz;
    const hbAmp = cfg.headBobAmp;
    this.headBobT += dt * hbHz * Math.PI * 2;
    const rawHB   = Math.sin(this.headBobT) * hbAmp;

    // Target head rotation = bob + mouse lean
    const headRotTgt = rawHB + this.mouseX * 5;
    this.sHeadRot.setTarget(headRotTgt);
    this.sHeadRot.k = cfg.bodySpring.k * 0.7;
    this.sHeadRot.d = cfg.bodySpring.d;
    this.sHeadRot.tick(dt);

    // Head translation from mouse (distance-aware)
    const nearFactor = clamp(this.mouseNearFactor, 0, 1);
    const hxTgt = this.mouseX * (4 + nearFactor * 4);
    const hyTgt = this.mouseY * (2 + nearFactor * 2);
    this.sHeadX.setTarget(hxTgt);
    this.sHeadY.setTarget(hyTgt);
    this.sHeadX.tick(dt);
    this.sHeadY.tick(dt);

    // Body springs
    this.sScaleX.tick(dt);
    this.sScaleY.tick(dt);
    this.sTransX.tick(dt);
    this.sTransY.tick(dt);
    this.sRotate.tick(dt);

    // Ear springs
    this.sEarL.tick(dt);
    this.sEarR.tick(dt);

    // Slowly return body springs to rest
    this.sScaleX.setTarget(1);
    this.sScaleY.setTarget(1);
    this.sTransX.setTarget(0);
    this.sTransY.setTarget(0);
    this.sRotate.setTarget(0);
    this.sEarL.setTarget(0);
    this.sEarR.setTarget(0);

    // Smooth eye offset toward mouse
    const eyeMax = 3.5 + nearFactor * 1.5;
    this.eyeOffX = lerp(this.eyeOffX, this.mouseX * eyeMax, dt * 8);
    this.eyeOffY = lerp(this.eyeOffY, this.mouseY * eyeMax, dt * 8);

    // Eye openness
    const blinkTarget = this.blinking ? 0 : cfg.eyeOpenTarget;
    this.eyeOpenTgt = blinkTarget;
    this.eyeOpen    = lerp(this.eyeOpen, this.eyeOpenTgt, dt * (this.blinking ? 28 : 18));
  }

  /* ── Emotion tick (smooth lerp of visual states) ──────────── */
  _tickEmotion(dt) {
    const cfg = BearController.CFG[this.state];
    const spd = dt * 3.5;

    this.emo.blush      = lerp(this.emo.blush,      cfg.blush,          spd);
    this.emo.happyArc   = lerp(this.emo.happyArc,   cfg.happyArcAlpha,  spd);
    this.emo.hunger     = lerp(this.emo.hunger,      cfg.hungerAlpha,    spd);
    this.emo.zzz        = lerp(this.emo.zzz,         cfg.zzzAlpha,       spd * 0.8);
    this.emo.spark      = lerp(this.emo.spark,       cfg.sparkAlpha,     spd);
    this.emo.mouthCurve = lerp(this.emo.mouthCurve,  cfg.mouthCurve,     spd);

    // Zzz float
    this.zzzT  += dt;
    this.sparkT += dt;
  }

  /* ── Apply all transforms to DOM ─────────────────────────── */
  _applyTransforms() {
    const breathVal  = Math.sin(this.breathT) * this.breathAmp;
    const scaleBreath= 1 + breathVal;

    // body squash+stretch layered on top of breath
    const sx = this.sScaleX.pos * scaleBreath;
    const sy = this.sScaleY.pos / Math.max(scaleBreath, 0.01);
    const tx = this.sTransX.pos;
    const ty = this.sTransY.pos;
    const rot= this.sRotate.pos;

    this.bearWrap.style.transform =
      `translate(${tx}px,${ty}px) rotate(${rot}deg) scale(${sx},${sy})`;

    // Shadow scale inversely: squash = wider shadow, stretch = narrower
    const shadowW = clamp(130 + (1 - sy) * 60, 80, 200);
    const shadowO = clamp(0.18 + (1 - sy) * 0.25, 0.05, 0.45);
    this.shadow.style.width   = shadowW + 'px';
    this.shadow.style.opacity = shadowO;

    // Head group
    const hx  = this.sHeadX.pos;
    const hy  = this.sHeadY.pos;
    const hr  = this.sHeadRot.pos;
    this.headG.setAttribute('transform',
      `translate(${hx},${hy}) rotate(${hr},100,170)`);

    // Ears
    const elY = this.sEarL.pos;
    const erY = this.sEarR.pos;
    this.earL.setAttribute('transform', `translate(0,${elY})`);
    this.earR.setAttribute('transform', `translate(0,${erY})`);

    // ── Eyes
    const ry = Math.max(this.eyeOpen * 12, 0.1);
    const ry2= Math.max(this.eyeOpen * 8, 0.1);
    const highlightA = this.eyeOpen;

    // Left eye
    this.pupilL.setAttribute('ry', ry.toFixed(2));
    this.irisL.setAttribute('ry', ry2.toFixed(2));
    this.hiL.setAttribute('opacity', highlightA.toFixed(2));
    this.arcL.setAttribute('opacity', this.emo.happyArc.toFixed(2));

    // Right eye
    this.pupilR.setAttribute('ry', ry.toFixed(2));
    this.irisR.setAttribute('ry', ry2.toFixed(2));
    this.hiR.setAttribute('opacity', highlightA.toFixed(2));
    this.arcR.setAttribute('opacity', this.emo.happyArc.toFixed(2));

    // Eye tracking offset
    const ex = this.eyeOffX.toFixed(2);
    const ey = this.eyeOffY.toFixed(2);
    document.getElementById('eye-L-g').setAttribute('transform', `translate(${ex},${ey})`);
    document.getElementById('eye-R-g').setAttribute('transform', `translate(${ex},${ey})`);

    // ── Mouth: lerped path + hungry open overlay
    const c = this.emo.mouthCurve;
    this.mouthPath.setAttribute('d', `M92,132 Q100,${132 + c} 108,132`);
    this.mouthOpen.setAttribute('opacity', this.emo.hunger.toFixed(2));
    // when hungry, hide the simple mouth path
    this.mouthPath.setAttribute('opacity', (1 - this.emo.hunger).toFixed(2));

    // ── Cheeks
    this.ckL.setAttribute('opacity', this.emo.blush.toFixed(2));
    this.ckR.setAttribute('opacity', this.emo.blush.toFixed(2));

    // ── Zzz
    const zt  = this.zzzT % 3;
    const zAlpha = this.emo.zzz;
    const zOff  = zt * 8;
    this.zzzG.setAttribute('opacity', zAlpha.toFixed(2));
    if (zAlpha > 0.01) {
      const fade = t => Math.max(0, 1 - t / 3);
      this.z1.setAttribute('opacity', (fade(zt) * 0.9).toFixed(2));
      this.z2.setAttribute('opacity', (fade(Math.max(0, zt - 0.5)) * 0.75).toFixed(2));
      this.z3.setAttribute('opacity', (fade(Math.max(0, zt - 1.2)) * 0.55).toFixed(2));
      this.z1.setAttribute('transform', `translate(0,${-zt * 6})`);
      this.z2.setAttribute('transform', `translate(0,${-Math.max(0, zt - 0.5) * 6})`);
      this.z3.setAttribute('transform', `translate(0,${-Math.max(0, zt - 1.2) * 6})`);
    }

    // ── Sparkles
    const sAlpha = this.emo.spark;
    this.sparkG.setAttribute('opacity', sAlpha.toFixed(2));
    if (sAlpha > 0.01) {
      const sf = 1 + Math.sin(this.sparkT * 2.8) * 0.12;
      this.sparkG.setAttribute('transform', `scale(${sf.toFixed(3)}) translate(${((1 - sf) * 100).toFixed(1)},${((1 - sf) * 110).toFixed(1)})`);
    }
  }

  /* ── Particle tick ────────────────────────────────────────── */
  _tickParticles() {
    if (!this.particles.length) return;
    this.ctx.clearRect(0, 0, 400, 400);
    this.particles = this.particles.filter(p => p.alpha > 0.02);
    this.particles.forEach(p => {
      p.vy += p.gravity;
      p.vx *= 0.98;
      p.vy *= 0.98;
      p.x  += p.vx;
      p.y  += p.vy;
      p.alpha -= p.decay;
      this.ctx.save();
      this.ctx.globalAlpha = p.alpha;
      this.ctx.fillStyle   = p.color;
      this.ctx.shadowColor = p.color;
      this.ctx.shadowBlur  = 8;
      this.ctx.beginPath();
      this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      this.ctx.fill();
      this.ctx.restore();
    });
    if (!this.particles.length) {
      this.ctx.clearRect(0, 0, 400, 400);
    }
  }

  /* ══════════════════════════════════════════════════════════════
     STATE MANAGEMENT
  ══════════════════════════════════════════════════════════════ */
  setState(newState, isAuto = false) {
    if (this.state === newState) return;
    this.prevState = this.state;
    this.state     = newState;

    this._applyStateCfg(newState, false);
    this._updateButtons(newState);
    if (!isAuto) this._showSpeech();

    // Reset auto-state timer on manual override
    if (!isAuto) {
      clearTimeout(this.autoStateTimer);
      this._schedAutoState();
    }
  }

  _applyStateCfg(state, initial) {
    const cfg = BearController.CFG[state];
    this.badge.textContent   = cfg.label;
    this.badge.style.background = cfg.bg;
    this.badge.style.color      = cfg.color;

    // Reset blink schedule for new state
    clearTimeout(this.blinkTimer);
    this._schedBlink();
  }

  /* ── Auto state transition ────────────────────────────────── */
  _schedAutoState() {
    const minMs = 12000, maxMs = 22000;
    const delay = minMs + Math.random() * (maxMs - minMs);
    this.autoStateTimer = setTimeout(() => {
      const states  = ['idle','happy','hungry','sleepy'];
      const others  = states.filter(s => s !== this.state);
      const next    = others[Math.floor(Math.random() * others.length)];
      this.setState(next, true);
      this._showSpeech();
      this._schedAutoState();
    }, delay);
  }

  /* ══════════════════════════════════════════════════════════════
     BLINKING
  ══════════════════════════════════════════════════════════════ */
  _schedBlink() {
    const cfg = BearController.CFG[this.state];
    const delay = cfg.blinkMin + Math.random() * (cfg.blinkMax - cfg.blinkMin);
    this.blinkTimer = setTimeout(() => {
      this._doBlink();
      this._schedBlink();
    }, delay);
  }

  _doBlink() {
    if (this.blinking) return;
    this.blinking = true;
    const closeMs = this.state === 'sleepy' ? 280 : 80;
    const openMs  = this.state === 'sleepy' ? 350 : 110;
    setTimeout(() => {
      this.blinking = false;
      // sleepy: sometimes do a double-blink
      if (this.state === 'sleepy' && Math.random() < 0.35) {
        setTimeout(() => {
          this.blinking = true;
          setTimeout(() => { this.blinking = false; }, openMs);
        }, 180);
      }
    }, closeMs + openMs);
  }

  /* ══════════════════════════════════════════════════════════════
     RANDOM BEHAVIOR SYSTEM
  ══════════════════════════════════════════════════════════════ */
  _schedRandomAct() {
    const delay = 1800 + Math.random() * 3500;
    this.randomActTimer = setTimeout(() => {
      this._doRandomAct();
      this._schedRandomAct();
    }, delay);
  }

  _doRandomAct() {
    const acts = ['earFlick', 'headTilt', 'breathJitter', 'earBoth'];
    const weights = {
      idle:   [3, 3, 2, 1],
      happy:  [2, 4, 1, 3],
      hungry: [1, 2, 1, 1],
      sleepy: [1, 2, 3, 0],
    };
    const w   = weights[this.state];
    const total = w.reduce((a,b) => a+b, 0);
    let r = Math.random() * total;
    let idx = 0;
    for (let i = 0; i < w.length; i++) {
      r -= w[i];
      if (r <= 0) { idx = i; break; }
    }
    const act = acts[idx];

    if (act === 'earFlick') {
      const ear = Math.random() < 0.5 ? this.sEarL : this.sEarR;
      ear.impulse(-(4 + Math.random() * 6));
    }
    if (act === 'earBoth') {
      this.sEarL.impulse(-(3 + Math.random() * 5));
      setTimeout(() => this.sEarR.impulse(-(3 + Math.random() * 5)), 80);
    }
    if (act === 'headTilt') {
      const dir = Math.random() < 0.5 ? 1 : -1;
      this.sHeadRot.impulse(dir * (6 + Math.random() * 8));
    }
    if (act === 'breathJitter') {
      this.breathNoiseTarget = (Math.random() - 0.5) * 0.15;
      setTimeout(() => { this.breathNoiseTarget = 0; }, 2500);
    }
  }

  /* ══════════════════════════════════════════════════════════════
     MOUSE TRACKING
  ══════════════════════════════════════════════════════════════ */
  _onMouseMove(e) {
    const rect = this.stage.getBoundingClientRect();
    const cx   = rect.left + rect.width  / 2;
    const cy   = rect.top  + rect.height / 2;

    // Normalized −1..1
    this.mouseX = clamp((e.clientX - cx) / (rect.width  / 2), -1, 1);
    this.mouseY = clamp((e.clientY - cy) / (rect.height / 2), -1, 1);

    // Distance factor: closer to center → 1, outside → 0
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    const maxD = Math.max(rect.width, rect.height) * 0.7;
    this.mouseNearFactor = clamp(1 - dist / maxD, 0, 1);
  }

  _onMouseLeave() {
    this.mouseX = 0;
    this.mouseY = 0;
    this.mouseNearFactor = 0;
  }

  /* ══════════════════════════════════════════════════════════════
     CLICK — direction-aware push + squash & stretch
  ══════════════════════════════════════════════════════════════ */
  _onStageClick(e) {
    const rect = this.stage.getBoundingClientRect();
    const cx   = rect.left + rect.width  / 2;
    const cy   = rect.top  + rect.height / 2;

    // Direction from click to center (push bear away from click)
    const dx = (e.clientX - cx) / (rect.width  / 2);
    const dy = (e.clientY - cy) / (rect.height / 2);

    // Squash toward click direction
    const pushStrength = BearController.CFG[this.state].state === 'sleepy' ? 8 : 14;
    const pushX = dx * pushStrength;
    const pushY = dy * pushStrength;

    this.sTransX.impulse(pushX * 0.6);
    this.sTransY.impulse(pushY * 0.4);
    this.sRotate.impulse(dx * 8);

    // Squash on hit axis
    if (Math.abs(dx) > Math.abs(dy)) {
      this.sScaleX.impulse(-0.25);
      this.sScaleY.impulse(0.15);
    } else {
      this.sScaleX.impulse(0.12);
      this.sScaleY.impulse(-0.22);
    }

    // Ear flick from shock
    this.sEarL.impulse(-8 - Math.random() * 6);
    this.sEarR.impulse(-8 - Math.random() * 6);

    // Head snap
    this.sHeadRot.impulse(dx * 12);

    // Blush burst
    this.emo.blush = Math.min(this.emo.blush + 0.4, 1.0);

    // Particles at click position (canvas offset-adjusted)
    const canvasRect = this.canvas.getBoundingClientRect();
    this._spawnParticles(e.clientX - canvasRect.left, e.clientY - canvasRect.top);

    this._showSpeech();
  }

  /* ══════════════════════════════════════════════════════════════
     SPEECH BUBBLE
  ══════════════════════════════════════════════════════════════ */
  _showSpeech() {
    clearTimeout(this.speechTimer);
    const lines = BearController.CFG[this.state].speech;
    this.speechEl.textContent = lines[Math.floor(Math.random() * lines.length)];
    this.speechEl.classList.add('show');
    this.speechTimer = setTimeout(() => this.speechEl.classList.remove('show'), 2000);
  }

  /* ══════════════════════════════════════════════════════════════
     PARTICLES
  ══════════════════════════════════════════════════════════════ */
  _spawnParticles(x, y) {
    const palettes = {
      idle:   ['#a8dadc','#57cc99','#80b918','#c7f2a4'],
      happy:  ['#f4c95d','#f4a261','#ff6b6b','#d0a8ff','#fff'],
      hungry: ['#f4a261','#e76f51','#c4562b','#f9c784'],
      sleepy: ['#c9b8e8','#a78bca','#e8d5ff','#d5c8f0'],
    };
    const colors = palettes[this.state];
    const count  = this.state === 'happy' ? 18 : 12;

    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 4.5;
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        radius: 3 + Math.random() * 5,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        decay: 0.022 + Math.random() * 0.028,
        gravity: 0.1,
      });
    }
  }

  /* ══════════════════════════════════════════════════════════════
     UI HELPERS
  ══════════════════════════════════════════════════════════════ */
  _updateButtons(state) {
    document.querySelectorAll('.ctrl-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.state === state);
    });
  }

  /* ══════════════════════════════════════════════════════════════
     EVENT BINDING
  ══════════════════════════════════════════════════════════════ */
  _bindEvents() {
    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        this.setState(btn.dataset.state);
      });
    });

    this.stage.addEventListener('click', e => this._onStageClick(e));
    document.addEventListener('mousemove', e => this._onMouseMove(e));
    this.stage.addEventListener('mouseleave', () => this._onMouseLeave());
  }
}

/* ── Boot ─────────────────────────────────────────────────────── */
const bear = new BearController();
</script>
