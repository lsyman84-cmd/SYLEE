<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="휴대폰에서 바로 실행 가능한 날씨 확인 앱" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>날씨 확인 앱</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>날씨 확인 앱</h1>
        <p class="subtitle">휴대폰에서 즉시 실행</p>
      </header>

      <section class="controls">
        <button id="use-location-btn" class="btn primary">내 위치로 확인</button>

        <form id="search-form" class="search-form">
          <label for="city-input" class="visually-hidden">도시 이름</label>
          <input
            id="city-input"
            type="text"
            name="city"
            autocomplete="off"
            placeholder="도시 이름 입력 (예: 서울, 부산)"
            required
          />
          <button type="submit" class="btn">검색</button>
        </form>
      </section>

      <section id="status" class="status" aria-live="polite"></section>

      <section id="weather-card" class="weather-card hidden" aria-live="polite">
        <h2 id="location-name">-</h2>
        <p id="updated-at" class="muted">-</p>
        <div class="temperature-wrap">
          <p id="temperature">--°C</p>
          <p id="condition">-</p>
        </div>
        <div class="details">
          <div>
            <span>체감</span>
            <strong id="apparent-temp">-</strong>
          </div>
          <div>
            <span>습도</span>
            <strong id="humidity">-</strong>
          </div>
          <div>
            <span>풍속</span>
            <strong id="wind-speed">-</strong>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
